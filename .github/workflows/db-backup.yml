# Nightly encrypted dump of the production database, kept as a workflow
# artifact for 30 days. Restore steps: docs/yedekleme.md.
#
# Repository secrets (Settings → Secrets and variables → Actions):
#   SUPABASE_DB_URL    Session pooler connection string (port 5432). The direct
#                      connection is IPv6 only and GitHub runners are IPv4.
#   BACKUP_PASSPHRASE  Long random passphrase. Keep a copy outside GitHub:
#                      without it the dumps cannot be opened.
name: Database backup

on:
  schedule:
    - cron: "0 0 * * *" # 03:00 Turkey time
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: db-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Install pg_dump 17
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17

      - name: Dump and encrypt
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          test -n "$SUPABASE_DB_URL" && test -n "$BACKUP_PASSPHRASE"
          name="studyom-$(date -u +%Y-%m-%d)"
          # Our tables plus Supabase's auth users (trainers.id points at auth.users).
          /usr/lib/postgresql/17/bin/pg_dump "$SUPABASE_DB_URL" \
            --format=custom --no-owner --no-privileges \
            --schema=public --schema=auth \
            --file="$name.dump"
          gpg --batch --yes --pinentry-mode loopback --passphrase-fd 3 \
            --symmetric --cipher-algo AES256 --output "$name.dump.gpg" "$name.dump" 3<<<"$BACKUP_PASSPHRASE"
          rm "$name.dump"
          ls -lh "$name.dump.gpg"
          echo "NAME=$name" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.NAME }}
          path: ${{ env.NAME }}.dump.gpg
          retention-days: 30
          if-no-files-found: error
